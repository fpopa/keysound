name: Deploy Landing Page

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
  workflow_dispatch:
  workflow_run:
    workflows: ["Build & Release"]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download latest DMG from release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download --pattern 'KeySound.dmg' --dir site/

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: site
          push: true
          tags: |
            ghcr.io/fpopa/keysound-site:latest
            ghcr.io/fpopa/keysound-site:${{ github.sha }}

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Deploy to server
        env:
          SERVER: ${{ secrets.SERVER_IP }}
          TUNNEL_TOKEN: ${{ secrets.KEYSOUND_TUNNEL_TOKEN }}
        run: |
          ssh ubuntu@$SERVER "sudo mkdir -p /opt/keysound.filippopa.com && sudo chown ubuntu:ubuntu /opt/keysound.filippopa.com"
          scp site/docker-compose.yml ubuntu@$SERVER:/opt/keysound.filippopa.com/docker-compose.yml
          ssh ubuntu@$SERVER "
            cd /opt/keysound.filippopa.com
            echo 'TUNNEL_TOKEN=$TUNNEL_TOKEN' > .env
            echo '${{ secrets.GITHUB_TOKEN }}' | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d
          "
